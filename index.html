<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pokopia Comfort Optimizer</title>
<meta name="description" content="Search a Pokemon and see which Pokopia items match its favorites, ranked by tag hits." />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="topbar">
  <h1>Pokopia Comfort Optimizer</h1>
  <p class="tagline">Search a Pokemon to see its favorites and the items that hit them.</p>
</header>

<main>
  <section class="search" role="search">
    <div class="combo">
      <input
        id="q"
        type="text"
        autocomplete="off"
        spellcheck="false"
        placeholder="Search a Pokemon, e.g. Bulbasaur"
        role="combobox"
        aria-expanded="false"
        aria-controls="suggestions"
        aria-autocomplete="list" />
      <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
    </div>
  </section>

  <section id="profile" class="profile" hidden></section>

  <section id="controls" class="controls" hidden>
    <label class="field">
      <span>Category</span>
      <select id="category"><option value="">All</option></select>
    </label>
    <label class="field">
      <span>Use</span>
      <select id="use"><option value="">All</option></select>
    </label>
    <label class="field">
      <span>Min. hits</span>
      <select id="minhits">
        <option value="1">1+</option>
        <option value="2">2+</option>
        <option value="3">3+</option>
        <option value="4">4+</option>
      </select>
    </label>
    <label class="check">
      <input id="matchedonly" type="checkbox" checked />
      <span>Only show matched tags on each item</span>
    </label>
    <p id="count" class="count"></p>
  </section>

  <section id="results" class="results" aria-live="polite"></section>

  <p id="empty" class="empty">Start typing a Pokemon name above.</p>
</main>

<footer class="footer">
  <p>
    Data compiled from
    <a href="https://pokopia.gamertw.com/item" rel="noreferrer">pokopia.gamertw.com</a>,
    <a href="https://www.serebii.net/pokemonpokopia/basinpokedex.shtml" rel="noreferrer">serebii.net</a>,
    and a community
    <a href="https://docs.google.com/spreadsheets/d/1YbVctFDD0irBiHuOg0eDDq5k_DQR4ToR5DcTLB3I5Jk/edit?gid=0#gid=0" rel="noreferrer">favorites spreadsheet</a>.
    Images are hotlinked from those sites.
  </p>
</footer>

<script src="app.js"></script>
</body>
</html>
